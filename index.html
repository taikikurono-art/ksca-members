<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クスカ 保護者ページ</title>
<meta name="theme-color" content="#F5F2EA">
<link rel="icon" type="image/png" href="img/kusuka-mark.png">
<link rel="apple-touch-icon" href="img/kusuka-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EA;--surface:#FFFFFF;--ink:#1E2A24;--sub:#5B6660;--line:#E3DDD0;--line2:#EEEAE0;--field:#CFC8B8;
  --green:#1E6B4E;--green-d:#154D38;--green-s:#E3F0E8;--green-b:#9FC7B2;--dark:#173F30;--dark-2:#245A45;--on-dark:#BFD6C9;
  --warn:#8A4B0F;--warn-d:#6E3A08;--warn-s:#FBEBD7;--warn-b:#D9893A;
  --red:#A33030;--red-d:#7E2222;--red-s:#FBE7E7;--maybe:#9A5A12;
  --hop:#A8325C;--hop-s:#FBE6EE;--soar:#1D5591;--soar-s:#E3EEF9;
  --muted:#EEEAE0;--disabled:#DDD7CA;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6}
a{color:var(--green)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid #2F7FD1;outline-offset:2px}
img{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 共通レイアウト */
.wrap{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hdr-l{display:flex;align-items:center;gap:12px;min-width:0}
.hdr-logo{height:22px;width:auto}
.hdr-sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-sub{background:none;border:0;min-height:44px;padding:0 4px;font-size:12px;color:var(--sub);text-decoration:underline}
.main{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px 16px 28px}
.back{align-self:flex-start;display:flex;align-items:center;gap:4px;min-height:44px;font-size:14px;font-weight:700;text-decoration:none;background:none;border:0;padding:0;color:var(--green)}
.title{display:flex;flex-direction:column;gap:2px}
.title h1{margin:0;font-family:var(--round);font-size:26px;line-height:1.3}
.title .s{font-size:14px;color:var(--sub)}
.eyebrow{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.08em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.card.warn{border:2px solid var(--warn-b);padding:15px 17px}
.card h2{margin:0;font-size:16px;line-height:1.4}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{font-size:13px;color:var(--sub);line-height:1.7;margin:0}
.small{font-size:12px;color:var(--sub)}

/* ボタン */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:12px;border:0;font-size:15px;font-weight:700;text-decoration:none;text-align:center}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-d)}
.btn-outline{background:var(--surface);border:2px solid var(--green);color:var(--green)}
.btn-off{background:var(--disabled);color:#4A534E}
.btn-sm{min-height:40px;font-size:13px;border-radius:8px;padding:0 12px}
.btn-line{background:#06C755;color:#fff}
.link-row{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 14px;border-radius:12px;background:var(--bg);text-decoration:none;color:var(--ink);font-size:14px;font-weight:700;border:0;width:100%}
.link{background:none;border:0;padding:0;min-height:44px;display:inline-flex;align-items:center;font-size:14px;font-weight:700;color:var(--green);text-decoration:none}

/* ラベル類 */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--green-s);color:var(--green-d)}
.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.gray{background:var(--muted);color:var(--sub)}
.pill.red{background:var(--red-s);color:var(--red-d)}
.pill.solid{background:var(--green);color:#fff}
.pill.line{background:var(--surface);border:1px solid var(--field);color:var(--sub)}
.tag{display:inline-flex;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag.hop{background:var(--hop-s);color:var(--hop)}
.tag.soar{background:var(--soar-s);color:var(--soar)}

/* お知らせ */
.news{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px}
.news b{display:block;font-size:14px}
.news span{font-size:12px}
.news.open{background:var(--green-s);border:1px solid var(--green-b);color:var(--green-d)}
.news.change{background:var(--warn-s);border:1px solid var(--warn-b);color:var(--warn-d)}
.news.cancel{background:var(--red-s);border:1px solid #E1A3A3;color:var(--red-d)}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-s);border:2px solid var(--warn-b);border-radius:12px;padding:12px 14px;color:var(--warn-d)}
.alert b{display:block;font-size:14px}
.alert span{font-size:12px;line-height:1.6}

/* 月の切り替え */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--field);background:var(--surface);font-size:13px;white-space:nowrap}
.chip.done{background:var(--muted);border-color:var(--line);color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}

/* ホーム */
.hero-date{font-family:var(--round);font-size:30px;line-height:1.25}
.acts{display:flex;flex-direction:column;gap:6px}
.acts div{display:flex;align-items:center;gap:8px;font-size:14px}
.info{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line2);padding-top:14px}
.info-row{display:flex;gap:10px;align-items:flex-start}
.info-row svg{flex-shrink:0;margin-top:2px;color:var(--green)}
.kv{display:flex;flex-direction:column;gap:1px}
.kv small{font-size:12px;color:var(--sub)}
.kv b{font-size:16px}
.kid-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.kid-row:last-child{border-bottom:0}
.kid-row .n{flex:1;font-size:15px;font-weight:700}
.st{font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.st.yes{color:var(--green)}.st.no{color:var(--red)}.st.maybe{color:var(--warn)}.st.none{color:var(--warn)}

/* 出欠 */
.kid-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kid-card.need{border:2px solid var(--warn-b);padding:15px}
.kid-head{display:flex;align-items:center;gap:10px}
.kid-head .n{flex:1;font-size:17px;font-weight:700}
.answers{display:flex;gap:8px}
.ans{flex:1 1 0;min-height:52px;border-radius:12px;border:2px solid var(--field);background:var(--surface);font-size:15px;font-weight:700}
.ans[aria-pressed="true"].yes{background:var(--green);border-color:var(--green);color:#fff}
.ans[aria-pressed="true"].no{background:var(--red);border-color:var(--red);color:#fff}
.ans[aria-pressed="true"].maybe{background:var(--maybe);border-color:var(--maybe);color:#fff}
.saving{font-size:12px;color:var(--sub);min-height:18px}
textarea,input[type=text],input[type=password],select{width:100%;border:1px solid var(--field);border-radius:10px;background:var(--surface);font-size:16px}
input[type=text],input[type=password],select{height:48px;padding:0 12px}
textarea{padding:10px 12px;resize:vertical;min-height:80px}
label.f{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.radio-list{display:flex;flex-direction:column;gap:6px}
.radio-list label{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.radio-list input{width:20px;height:20px;accent-color:var(--green);margin:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--field);background:var(--surface);font-size:20px;line-height:1}
.stepper b{min-width:28px;text-align:center;font-size:18px}

/* 金額 */
.money-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.money-row.sub{color:var(--sub)}
.money-row.disc{color:var(--warn)}
.money-row.strong{font-size:15px;font-weight:700}
.bill{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line2)}
.bill:first-child{padding-top:4px}
.bill-head{display:flex;align-items:center;gap:8px}
.bill-head b{font-size:15px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px}
.total b{font-family:var(--round);font-size:28px}
.done-mark{width:64px;height:64px;border-radius:32px;background:var(--green-s);color:var(--green);display:flex;align-items:center;justify-content:center;align-self:center}
.hist-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-top:1px solid var(--line2)}

/* しおり・日程 */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.grid2 .wide{grid-column:1/-1}
.check-item{display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--line2);font-size:15px}
.check-item:last-of-type{border-bottom:0}
.check-item input{width:22px;height:22px;accent-color:var(--green);margin:0;flex-shrink:0}
.check-item.on span{color:var(--sub);text-decoration:line-through}
.sched{padding:4px 0}
.sched-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.sched-row:first-child{border-top:0}
.sched-row.next{background:var(--green-s)}
.sched-row.done{opacity:.72}
.sched-date{width:66px;flex-shrink:0;display:flex;flex-direction:column}
.sched-date b{font-family:var(--round);font-size:18px}
.sched-body{flex:1;min-width:0;display:flex;flex-direction:column}
.sched-body b{font-size:14px}

/* 下のメニュー */
.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav a,.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;text-decoration:none;color:var(--sub);font-size:11px;background:none;border:0}
.nav [aria-current="page"]{color:var(--green);font-weight:700}

/* ログイン */
.login{padding:48px 20px 28px;gap:24px}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:10px}
.login-logo img{width:200px;height:auto}
.login-logo b{font-size:14px;letter-spacing:.1em}
.cls-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cls-opt{display:flex;flex-direction:column;gap:2px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.cls-opt:has(input:checked){border-color:var(--green);background:var(--green-s)}
.cls-opt span{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700}
.cls-opt input{accent-color:var(--green);margin:0}
.cls-opt small{font-size:12px;color:var(--sub);padding-left:20px}
.err{font-size:13px;color:var(--red);font-weight:700;min-height:0}
.foot-links{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:12px}
.foot-links div{display:flex;gap:20px}
.foot-links a{font-size:13px}
.tagline{font-family:var(--round);font-size:13px;color:var(--sub)}

/* 読み込み中 */
.skel{background:linear-gradient(90deg,#ebe7dc 25%,#f5f2ea 50%,#ebe7dc 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.15);border-top-color:currentColor;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}

/* トースト・モーダル */
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:#1E2A24;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.ok{background:var(--green)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:22px 20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.modal h2{margin:0;font-size:17px}

/* 引率スタッフ */
.dark-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--dark);color:#fff}
.dark-hdr .link-sub{color:var(--on-dark)}
.progress{height:10px;border-radius:5px;background:var(--muted);overflow:hidden}
.progress div{height:10px;background:var(--green)}
.check-kid{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.check-kid.on{background:var(--green-s);border:2px solid var(--green);padding:0 15px}
.check-kid input{width:26px;height:26px;accent-color:var(--green);margin:0;flex-shrink:0}
.check-kid .n{flex:1;display:flex;flex-direction:column}
.check-kid .n b{font-size:17px}

/* 管理画面 */
.admin{display:flex;min-height:100vh}
.side{width:220px;flex-shrink:0;background:var(--dark);color:#fff;display:flex;flex-direction:column;gap:4px;padding:24px 14px;position:sticky;top:0;height:100vh}
.side-logo{display:flex;flex-direction:column;gap:10px;padding:0 10px 20px}
.side-logo img{width:120px;height:auto}
.side-logo small{font-size:12px;color:var(--on-dark);letter-spacing:.1em}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-nav button{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:none;color:#E4EFE9;font-size:14px;text-align:left}
.side-nav button[aria-current="page"]{background:var(--dark-2);color:#fff;font-weight:700}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#F2B266;color:#3D2305}
.side .link-sub{margin-top:auto;color:var(--on-dark);text-align:left;padding:0 12px}
.amain{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;padding:28px 32px}
.atop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.atop h1{margin:0;font-family:var(--round);font-size:28px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile.warn{border:2px solid var(--warn-b);padding:13px 15px}
.tile small{font-size:12px;color:var(--sub)}
.tile b{font-family:var(--round);font-size:26px}
.tile b span{font-size:14px;color:var(--sub)}
.acols{display:flex;gap:18px;align-items:flex-start}
.tablecard{flex:1;min-width:0;padding:0;gap:0}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--field);background:var(--surface);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.seg.sq button{border-radius:8px}
.seg.sq button[aria-pressed="true"]{background:var(--green-s);border-color:var(--green);color:var(--green-d)}
.tscroll{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--sub);font-size:12px;padding:10px 8px;white-space:nowrap}
th:first-child,td:first-child{padding-left:18px}
td{padding:11px 8px;border-top:1px solid var(--line2);vertical-align:middle}
td small{display:block;font-size:11px;color:var(--sub);font-weight:400}
td:first-child{min-width:130px}
td:nth-child(2),td:nth-child(3),td:nth-child(5),td:nth-child(7){white-space:nowrap}
.aside{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.status-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.status-grid button{min-height:40px;border-radius:8px;border:1px solid var(--field);background:var(--surface);font-size:13px}
.status-grid button[aria-pressed="true"]{border:2px solid var(--green);background:var(--green-s);color:var(--green-d);font-weight:700}
.req{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--bg);font-size:13px;line-height:1.6}
.req-btns{display:flex;gap:8px}
.req-btns .btn{flex:1}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.acols{flex-direction:column;align-items:stretch}.tablecard{flex:none}.aside{width:100%}}
@media (max-width:760px){
  table{min-width:700px}
  .admin{flex-direction:column}
  .side{width:auto;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px 14px;gap:8px}
  .side-logo{flex-direction:row;align-items:center;padding:0 6px}
  .side-logo img{width:80px}
  .side-nav{flex-direction:row;flex-wrap:wrap}
  .side .link-sub{margin-top:0;margin-left:auto}
  .amain{padding:18px 14px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<script>
// LINEアプリ内ブラウザで開いたら、外部ブラウザで開き直す
(function(){
  var ua = navigator.userAgent || "";
  if (ua.indexOf("Line/") >= 0 && location.href.indexOf("openExternalBrowser=1") < 0) {
    location.href = location.href + (location.href.indexOf("?") >= 0 ? "&" : "?") + "openExternalBrowser=1";
  }
})();

// =============================================================
// 設定
// =============================================================
var CONFIG = {
  GAS_URL: "https://script.google.com/macros/s/AKfycby3ldBnzepQBPSuXQXuMMrzH6kaA_aG4ZaxL0fnMwjasjmPQL1xNEuCacBOKTQNUQrH/exec",
  LINE_URL: "https://lin.ee/NIuLm2i"
};
var CLASSES = {
  kanayama: { label: "金山クラス（日）", short: "金山", day: "日曜日" },
  ozone:    { label: "大曽根クラス（土）", short: "大曽根", day: "土曜日" }
};
var ANS = { yes: "参加", no: "欠席", maybe: "検討中" };
var PARENT_KEYS = { "子どものみ参加": "none", "保護者も参加（集合から一緒）": "together", "保護者も参加（現地集合）": "local" };
var PARENT_VIEWS = ["home", "attend", "pay", "detail", "schedule", "family"];

var S = {
  session: null, data: null, month: null, busy: {}, justPaid: false,
  login: { step: "class", classId: "kanayama", names: [], classToken: "", error: "" },
  admin: { data: null, month: null, tab: "all", cls: "all", section: "overview", newsCls: "all" },
  staff: { data: null, group: "", classId: "", month: null, timer: null, syncedAt: "" }
};
var $app = document.getElementById("app");

// =============================================================
// 小さな道具
// =============================================================
function esc(v) {
  return String(v === null || v === undefined ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function yen(n) { return Number(n || 0).toLocaleString("ja-JP") + "円"; }
function san(list) { return list.map(function (n) { return n + "さん"; }).join("・"); }
function store(k, v) { try { if (v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function tagHtml(type) { return type === "soar" ? '<span class="tag soar">SOAR</span>' : '<span class="tag hop">HOP</span>'; }
function theme(text) {
  var t = String(text || "");
  var m = t.match(/「([^」]+)」/);
  if (m) return m[1];
  t = t.split(/\n|—|－/)[0].trim();
  return t.length > 24 ? t.slice(0, 24) + "…" : t;
}
function nowHM() { var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }

function toast(msg, ok) {
  var box = document.getElementById("toast");
  var el = document.createElement("div");
  el.className = "toast" + (ok ? " ok" : "");
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4500);
}

// =============================================================
// サーバーとの通信（合言葉やトークンはURLに載せない）
// =============================================================
function ApiError(code, message) { this.code = code; this.message = message; }

async function api(action, params) {
  var body = Object.assign({ action: action }, params || {});
  if (S.session && S.session.token && !body.token && action.indexOf("login_") !== 0) body.token = S.session.token;
  var res, text, data;
  try {
    res = await fetch(CONFIG.GAS_URL, { method: "POST", body: JSON.stringify(body), redirect: "follow" });
    text = await res.text();
  } catch (e) {
    throw new ApiError("network", "通信できませんでした。電波の良い場所でもう一度お試しください。");
  }
  try { data = JSON.parse(text); } catch (e) {
    throw new ApiError("server", "サーバーの応答を読み取れませんでした。時間をおいてお試しください。");
  }
  if (data && data.error) {
    if (data.error === "auth" && action.indexOf("login_") !== 0) logout(data.message);
    throw new ApiError(data.error, data.message || "エラーが発生しました。");
  }
  return data;
}

// =============================================================
// ログイン状態
// =============================================================
function setSession(s) {
  S.session = s;
  store("kusuka_session_v1", s || undefined);
}

function logout(message) {
  var name = S.session && S.session.name;
  if (name) store("kusuka_boot_" + name, undefined);
  setSession(null);
  S.data = null; S.admin.data = null; S.staff.data = null;
  stopStaffPolling();
  S.login = { step: "class", classId: (S.login && S.login.classId) || "kanayama", names: [], classToken: "", error: message || "" };
  location.hash = "";
  render();
}

// 画面の切り替え
// =============================================================
function currentView() { return (location.hash || "").replace(/^#\/?/, ""); }
function go(v) {
  if (currentView() === v) render(); else location.hash = "#/" + v;
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

function render() {
  var s = S.session, v = currentView();
  if (!s) {
    if (v === "staff-login") return renderStaffLogin();
    if (v === "admin-login") return renderAdminLogin();
    return renderLogin();
  }
  if (s.role === "parent") {
    if (!S.data) return renderLoading();
    if (PARENT_VIEWS.indexOf(v) < 0) v = "home";
    return VIEWS[v]();
  }
  if (s.role === "admin") return renderAdmin();
  if (s.role === "staff") return renderStaff();
}

function D() { return S.data; }
function schedOf(m) { return D().schedule.filter(function (e) { return e.month === m; })[0] || null; }
function dateText(e) { return e ? e.label + "（" + e.dow + "）" : ""; }
function quote(m) { return D().quotes[m]; }
function multi() { return D().children.length > 1; }
function unansweredOf(q) { return q.members.filter(function (x) { return !x.answer; }).map(function (x) { return x.name; }); }
function canPay(q) { return q.undecided.length === 0 && q.due > 0 && q.status !== "notready"; }

function payBlockReason(q) {
  if (q.status === "notready") return "参加費の案内のあとにお支払いできます。";
  if (q.undecided.length) {
    return multi() ? san(q.undecided) + "の出欠が決まると、兄弟姉妹の分をまとめてお支払いできます。"
                   : "出欠が決まるとお支払いできます。";
  }
  if (q.status === "paid") return "お支払い済みです。";
  return "参加するお子さまがいないため、お支払いはありません。";
}

function viewAttend() {
  var m = S.month, e = schedOf(m), q = quote(m), act = D().acts[m];
  var done = e && e.status === "done";
  var h = backLink() + '<div class="title"><h1>' + m + '月の出欠</h1><span class="s">' + esc(dateText(e)) + (act && act.place ? " " + esc(act.place) : "") + "</span></div>";

  if (done) h += '<div class="news cancel" style="background:var(--muted);border-color:var(--line);color:var(--sub)">' + I.alert + "<div><b>この活動は終了しました</b><span>回答の変更はできません。</span></div></div>";

  var un = unansweredOf(q);
  if (!done && multi() && un.length) {
    h += '<div class="alert" role="alert">' + I.alert + "<div><b>" + esc(san(un)) + "の出欠がまだです</b>" +
      "<span>兄弟姉妹それぞれ「参加」か「欠席」を選んでください。お休みの子も「欠席」を押してください。</span></div></div>";
  }

  q.members.forEach(function (c) {
    var busy = S.busy["ans:" + c.name];
    h += '<section class="kid-card' + (!c.answer && !done ? " need" : "") + '" aria-label="' + esc(c.name) + '"><div class="kid-head">' + tagHtml(c.type) +
      '<span class="n">' + esc(c.name) + "</span>" +
      (c.answer ? '<span class="st ' + c.answer + '">' + ANS[c.answer] + "</span>" : '<span class="st none">未回答</span>') + "</div>" +
      '<div class="answers" role="group" aria-label="' + esc(c.name) + 'の出欠">' +
      ["yes", "no", "maybe"].map(function (a) {
        return '<button type="button" class="ans ' + a + '" data-act="answer" data-name="' + esc(c.name) + '" data-a="' + a + '" aria-pressed="' + (c.answer === a) + '"' +
          (busy || done ? " disabled" : "") + ">" + ANS[a] + "</button>";
      }).join("") + "</div>" +
      '<div class="saving" aria-live="polite">' + (busy ? '<span class="spin"></span> 保存中…' : (c.at ? "回答 " + esc(c.at) : "")) + "</div></section>";
  });

  if (q.parentEvent && !done) {
    var pk = PARENT_KEYS[q.parentAnswer] || "";
    h += '<section class="card" aria-label="保護者の参加"><h2>保護者の参加</h2><div class="radio-list">' +
      [["none", "子どものみ参加"], ["together", "保護者も参加（集合から一緒）"], ["local", "保護者も参加（現地集合）"]].map(function (o) {
        return '<label><input type="radio" name="parentAns" value="' + o[0] + '" data-change="parentAnswer"' + (pk === o[0] ? " checked" : "") + ">" + o[1] + "</label>";
      }).join("") + '</div><p class="muted">保護者も参加する場合、参加費から1,000円引きになります。</p>' +
      '<h2 style="margin-top:6px">名簿にない兄弟姉妹の体験参加</h2><div class="stepper">' +
      '<button type="button" data-act="trial" data-d="-1" aria-label="1人へらす"' + (q.trialCount <= 0 ? " disabled" : "") + ">−</button>" +
      "<b>" + q.trialCount + '</b><span>人</span><button type="button" data-act="trial" data-d="1" aria-label="1人ふやす"' + (q.trialCount >= 5 ? " disabled" : "") + ">＋</button>" +
      '<span class="small">1人500円</span></div></section>';
  }

  if (!done) {
    h += '<div><label class="f" for="note">スタッフへの連絡（任意）</label><textarea id="note" rows="3" maxlength="300" placeholder="遅れて合流する、アレルギーの連絡など">' +
      esc(D().notes[m] || "") + '</textarea><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px">' +
      '<span class="small">出欠はタップした時点で保存されます</span>' +
      '<button type="button" class="btn btn-outline btn-sm" data-act="saveNote"' + (S.busy.note ? " disabled" : "") + ">" + (S.busy.note ? "送信中…" : "連絡を送る") + "</button></div></div>";
  }

  h += '<section class="card" aria-label="お支払い予定"><h2>お支払い予定</h2>' + billSummary(q) + "</section>";
  page(h);
}

function billSummary(q) {
  var h = "";
  if (!q.items.length) h += '<p class="muted">' + (q.undecided.length ? "参加予定のお子さまはまだいません。" : "この月のお支払いはありません。") + "</p>";
  q.items.forEach(function (it) {
    var note = [];
    if (it.sibling) note.push("兄弟割 −" + yen(it.sibling));
    if (it.jumpup) note.push("教室割 −" + yen(it.jumpup));
    if (it.parent) note.push("保護者参加割 −" + yen(it.parent));
    h += '<div class="money-row"><span>' + esc(it.kind === "trial" ? it.name + " " + it.count + "人" : it.name + "（" + it.type.toUpperCase() + "）") +
      (note.length ? '<span class="small" style="display:block;color:var(--warn)">' + esc(note.join("・")) + "</span>" : "") +
      (it.paid ? '<span class="small" style="display:block;color:var(--green-d)">お支払い済み</span>' : "") +
      "</span><b>" + yen(it.amount) + "</b></div>";
  });
  if (q.status === "partial") h += '<div class="money-row sub"><span>お支払い済み</span><span>−' + yen(q.paidAmount) + "</span></div>";
  h += '<div class="total" style="border-top:1px solid var(--line2)"><b style="font-family:inherit;font-size:14px">' + (q.status === "paid" ? "お支払い済み" : "お支払い金額") +
    "</b><b>" + yen(q.status === "paid" ? q.paidAmount : q.due) + "</b></div>";
  if (canPay(q)) h += '<a class="btn btn-primary" href="#/pay">お支払いへ進む</a>';
  else if (q.status !== "paid") h += '<button class="btn btn-off" type="button" disabled>お支払いへ進む</button><p class="small" style="margin:0;color:var(--warn-d)">' + esc(payBlockReason(q)) + "</p>";
  return h;
}

  } else if (!q.items.length) {

      }
      h += '<div class="bill"><div class="bill-head">' + tagHtml(it.type) + "<b>" + esc(it.name) + "</b>" + (it.paid ? '<span class="pill ok" style="margin-left:auto">支払い済み</span>' : "") + "</div>" +

        (it.sibling ? '<div class="money-row disc"><span>兄弟割</span><span>−' + yen(it.sibling) + "</span></div>" : "") +
        (it.jumpup ? '<div class="money-row disc"><span>教室割</span><span>−' + yen(it.jumpup) + "</span></div>" : "") +
        (it.parent ? '<div class="money-row disc"><span>保護者参加割</span><span>−' + yen(it.parent) + "</span></div>" : "") +
        '<div class="money-row strong"><span>小計</span><span>' + yen(it.amount) + "</span></div></div>";
    });
    if (q.status === "partial") h += '<div class="money-row sub" style="padding-top:12px"><span>お支払い済み</span><span>' + yen(q.paidAmount) + "</span></div>";
    h += '<div class="total"><b style="font-family:inherit;font-size:15px">' + (q.status === "partial" ? "追加のお支払い" : "合計") + "</b><b>" + yen(q.due) + "</b></div></section>";

    if (canPay(q)) {
      h += '<button class="btn btn-primary" type="button" data-act="checkout" style="min-height:56px;font-size:16px"' + (S.busy.checkout ? " disabled" : "") + ">" +

        '<p class="small" style="margin:0;text-align:center;line-height:1.7">集合時間までにお支払いをお願いします。<br>カード情報はクスカには保存されず、決済会社（Stripe）が安全に処理します。</p>';

  var hist = D().payments;

async function loadParent() {
  var cached = load("kusuka_boot_" + S.session.name);
  if (cached && cached.data && Date.now() - cached.ts < 86400000 && !S.data) {
    S.data = cached.data;
    if (!S.month) S.month = S.data.defaultMonth;
    render();
  }
  var data = await api("bootstrap");
  S.data = data;
  if (!S.month || !schedOf(S.month)) S.month = data.defaultMonth;
  saveBoot();
  render();
}
function saveBoot() { store("kusuka_boot_" + S.session.name, { ts: Date.now(), data: S.data }); }

function withinDays(m, days) {
  var e = schedOf(m);
  if (!e) return false;
  var p = e.date.split("-");
  var diff = (new Date(+p[0], +p[1] - 1, +p[2]) - new Date()) / 86400000;
  return diff >= -1 && diff <= days;
}

function showLineModal() {
  var bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="lm"><h2 id="lm">LINEでもご連絡ください</h2>' +
    '<p class="muted">活動の1週間以内の欠席は、スタッフへLINEでも一報いただけると助かります。</p>' +
    '<a class="btn btn-line" href="' + esc(CONFIG.LINE_URL) + '" target="_blank" rel="noopener">LINEで連絡する</a>' +
    '<button type="button" class="link" style="align-self:center" data-close>閉じる</button></div>';
  bg.addEventListener("click", function (ev) { if (ev.target === bg || ev.target.hasAttribute("data-close")) bg.remove(); });
  document.body.appendChild(bg);
  bg.querySelector("[data-close]").focus();
}

document.addEventListener("click", function (e) {

});
document.addEventListener("change", function (e) {

  var fn = CHANGES[el.dataset.change];

});

  var fn = SUBMITS[e.target.dataset.form];
  if (fn) { e.preventDefault(); fn(e.target); }
});

    if (r.trial) pay += "<small>体験参加 " + r.trial + "人</small>";
    if (r.refundCheck) pay += '<small style="color:var(--red)">支払い後に欠席あり</small>';
    table += "<tr><td><b>" + esc(r.name) + "</b>" + (r.household ? "<small>世帯 " + esc(r.household) + (r.hasSibling ? "・兄弟割" : "") + "</small>" : "") + "</td>" +
      "<td>" + esc(CLASSES[r.classId].short) + "</td><td>" + tagHtml(r.type) + "</td><td>" + ans + (r.at ? "<small>" + esc(r.at) + "</small>" : "") + "</td>" +
      "<td>" + pay + '</td><td style="font-size:12px;max-width:220px">' + esc(r.note || "—") + '</td><td style="text-align:right;padding-right:18px">' +
      (r.answer === "yes" ? '<button type="button" class="btn btn-outline btn-sm" style="border-width:1px;border-color:var(--field);color:var(--ink)" data-act="adminCancel" data-c="' + r.classId + '" data-name="' + esc(r.name) + '">欠席にする</button>' : "") + "</td></tr>";
  });
  table += "</tbody></table></div></section>";

  // 右側
  var nc = A.newsCls, cur = d.news[nc] || { status: "normal", message: "" }, st = A.newsStatus || cur.status || "normal";
  var aside = '<div class="aside"><section class="card" aria-label="保護者へのお知らせ"><h2>保護者へのお知らせ</h2>' +
    '<div class="seg sq" role="group" aria-label="対象">' + [["all", "全クラス"], ["kanayama", "金山"], ["ozone", "大曽根"]].map(function (x) {
      return '<button type="button" data-act="newsCls" data-c="' + x[0] + '" aria-pressed="' + (nc === x[0]) + '">' + x[1] + "</button>";
    }).join("") + '</div><div class="status-grid" role="group" aria-label="開催状況">' + [["normal", "表示しない"], ["open", "予定どおり開催"], ["change", "変更あり"], ["cancel", "中止"]].map(function (x) {
      return '<button type="button" data-act="newsStatus" data-st="' + x[0] + '" aria-pressed="' + (st === x[0]) + '">' + x[1] + "</button>";
    }).join("") + '</div><div><label class="f" for="newsMsg">ひとこと（任意）</label><input id="newsMsg" type="text" maxlength="200" value="' + esc(cur.message) + '" placeholder="例：集合場所を北口に変更します"></div>' +
    '<button type="button" class="btn btn-primary btn-sm" data-act="newsSave">お知らせを更新する</button></section>';

  if (d.requests.length) {
    aside += '<section class="card warn" aria-label="兄弟の申請"><div class="card-head"><h2>兄弟の申請 ' + d.requests.length + '件</h2></div>' +
      '<button type="button" class="link" data-act="adminSection" data-s="requests">確認して承認する</button></section>';
  }
  var none = rows.filter(function (r) { return !r.answer; });
  aside += '<section class="card" aria-label="未回答のお子さま"><h2>未回答のお子さま ' + none.length + "人</h2>" +
    (none.length ? '<p class="muted" style="font-size:13px">' + esc(none.slice(0, 12).map(function (r) { return r.name + "（" + CLASSES[r.classId].short + "）"; }).join("、")) + (none.length > 12 ? " ほか" : "") + "</p>" +
      '<button type="button" class="btn btn-outline btn-sm" data-act="copyUnanswered">LINE用に名前をコピー</button>' : '<p class="muted">全員回答済みです。</p>') + "</section>";
  aside += '<section class="card" aria-label="お支払いの照合"><h2>お支払いの照合</h2><p class="muted">決済後に画面を閉じた保護者の支払いも、Stripeの記録から取り込みます。</p>' +
    (c.refundCheck ? '<p class="muted" style="color:var(--red)">支払い後に欠席へ変更した家庭が ' + c.refundCheck + " 件あります。</p>" : "") +
    '<button type="button" class="btn btn-outline btn-sm" data-act="syncPay">Stripeと照合する</button></section></div>';

  return h + '<div class="acols">' + table + aside + "</div>";
}

function adminRequests(d) {
  var h = '<div class="atop"><div><h1>兄弟の申請</h1><div class="small" style="font-size:14px">承認すると、名簿の世帯ID（S列）が自動で入ります</div></div></div>';
  if (!d.requests.length) return h + '<section class="card"><p class="muted">確認待ちの申請はありません。</p></section>';
  return h + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">' + d.requests.map(function (r) {
    return '<section class="card"><div class="req"><span><b>' + esc(r.target) + "</b>（" + esc(CLASSES[r.targetClassId] ? CLASSES[r.targetClassId].short : "") + "）を</span>" +
      "<span><b>" + esc(r.from) + "</b>（" + esc(CLASSES[r.fromClassId] ? CLASSES[r.fromClassId].short : "") + "）の兄弟姉妹として</span>" +
      '<span class="small">' + esc(r.at) + " 申請</span></div>" +
      '<div class="req-btns"><button type="button" class="btn btn-primary btn-sm" data-act="decide" data-id="' + esc(r.id) + '" data-ok="1">承認して世帯をつなぐ</button>' +
      '<button type="button" class="btn btn-outline btn-sm" style="flex:0 0 auto;border-width:1px;border-color:var(--field);color:var(--ink)" data-act="decide" data-id="' + esc(r.id) + '" data-ok="0">却下</button></div></section>';
  }).join("") + "</div>";
}

function copyText(text, doneMsg) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { toast(doneMsg, true); }, function () { prompt("コピーしてください", text); });
  } else {
    prompt("コピーしてください", text);
  }
}

async function loadAdminPins() {
  S.admin.pins = null;
  renderAdmin();
  try {
    var both = await Promise.all([api("admin_pins"), api("admin_invite")]);
    S.admin.pins = both[0].list; S.admin.invite = both[1];
  } catch (err) { toast(err.message); S.admin.pins = []; }
  renderAdmin();
}

function inviteUrl(cid) {
  var inv = S.admin.invite || {};
  var k = inv.common || (inv.keys && inv.keys[cid]);
  if (!k) return "";
  return location.origin + location.pathname + "?" + (cid ? "c=" + cid + "&" : "") + "k=" + encodeURIComponent(k);
}

function pinRows() {
  var list = S.admin.pins || [], cls = S.admin.cls;
  return cls === "all" ? list : list.filter(function (g) { return g.classId === cls; });
}

function adminPins() {
  var A = S.admin;
  var h = '<div class="atop"><div><h1>暗証番号</h1><div class="small" style="font-size:14px">世帯ごとに1つ。LINEの個別トークで伝えてください。再発行すると、その家庭は新しい番号でログインし直しになります。</div></div></div>';
  if (!A.pins) return h + '<div class="small"><span class="spin"></span> 読み込み中…</div>';
  var inv = A.invite || {};
  if (inv.common) {
    var common = inviteUrl("");
    h += '<section class="card" aria-label="保護者ページのリンク"><h2>保護者ページのリンク</h2>' +
      '<p class="muted">LINEのリッチメニューとグループに使うリンクです（金山・大曽根共通）。このリンクから開くと、合言葉の入力は不要です。合言葉（PW_PARENT）を変えたら、リッチメニューのリンクも差し替えてください。</p>' +
      '<div style="font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--bg);border-radius:8px;padding:10px 12px;word-break:break-all">' + esc(common) + "</div>" +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn btn-primary btn-sm" data-act="copyLink">リッチメニュー用にURLだけコピー</button>' +
      '<button type="button" class="btn btn-outline btn-sm" data-act="copyInvite" data-c="">グループ用に案内文つきでコピー</button></div></section>';
  } else {
    h += '<section class="card" aria-label="LINEグループ用のリンク"><h2>LINEグループ用のリンク</h2>' +
      '<p class="muted">スクリプト プロパティに PW_PARENT（全クラス共通の合言葉）を設定すると、リッチメニューにも使える共通リンクになります。</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' + Object.keys(CLASSES).map(function (cid) {
        return inviteUrl(cid) ? '<button type="button" class="btn btn-primary btn-sm" data-act="copyInvite" data-c="' + cid + '">' + esc(CLASSES[cid].short) + "クラスのリンクをコピー</button>"
                   : '<span class="pill warn">' + esc(CLASSES[cid].short) + "：合言葉が未設定</span>";
      }).join("") + "</div></section>";
  }
  var rows = pinRows();
  var missing = (A.pins || []).filter(function (g) { return !g.pin; }).length;
  h += '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
    (missing ? '<button type="button" class="btn btn-primary btn-sm" data-act="pinIssueMissing">未発行の家庭に発行（' + missing + "家庭）</button>" : '<span class="pill ok">全家庭に発行済み</span>') +
    '<button type="button" class="btn btn-outline btn-sm" data-act="pinCopyAll">表示中の家庭の文面をまとめてコピー</button>' +
    '<div class="seg sq" role="group" aria-label="クラス" style="margin-left:auto">' + [["all", "全クラス"], ["kanayama", "金山"], ["ozone", "大曽根"]].map(function (x) {
      return '<button type="button" data-act="adminCls" data-c="' + x[0] + '" aria-pressed="' + (A.cls === x[0]) + '">' + x[1] + "</button>";
    }).join("") + "</div></div>";
  h += '<section class="card tablecard" aria-label="暗証番号の一覧"><div class="tscroll"><table><thead><tr><th scope="col">家庭</th><th scope="col">クラス</th><th scope="col">暗証番号</th><th scope="col"><span class="sr">操作</span></th></tr></thead><tbody>';
  rows.forEach(function (g) {
    h += "<tr><td><b>" + esc(g.names.join("・")) + "</b>" + (g.household ? "<small>世帯 " + esc(g.household) + "</small>" : "") + "</td>" +
      "<td>" + esc(g.classes.join("・")) + "</td>" +
      '<td><b style="font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.15em">' + (g.pin ? esc(g.pin) : '<span class="pill warn" style="letter-spacing:0">未発行</span>') + "</b></td>" +
      '<td style="text-align:right;padding-right:18px"><div style="display:inline-flex;gap:6px">' +
      (g.pin ? '<button type="button" class="btn btn-outline btn-sm" data-act="pinCopy" data-key="' + esc(g.key) + '">文面をコピー</button>' : "") +
      '<button type="button" class="btn btn-outline btn-sm" style="border-width:1px;border-color:var(--field);color:var(--ink)" data-act="pinReissue" data-key="' + esc(g.key) + '" data-names="' + esc(g.names.join("・")) + '">' + (g.pin ? "再発行" : "発行") + "</button></div></td></tr>";
  });
  h += "</tbody></table></div></section>";
  return h;
}

function adminCheck() {
  var C = S.adminCheck || { classId: "kanayama" };
  var h = '<div class="atop"><div><h1>当日チェック</h1><div class="small" style="font-size:14px">' + S.admin.month + "月・引率スタッフと同じ画面です</div></div>" +
    '<div class="seg sq" role="group" aria-label="クラス">' + Object.keys(CLASSES).map(function (id) {
      return '<button type="button" data-act="checkCls" data-c="' + id + '" aria-pressed="' + (C.classId === id) + '">' + CLASSES[id].short + "</button>";
    }).join("") + "</div></div>";
  if (!C.data) return h + '<div class="small"><span class="spin"></span> 読み込み中…</div>';
  return h + '<div style="max-width:480px;display:flex;flex-direction:column;gap:14px">' + checkBody(C.data) + "</div>";
}

// =============================================================
// 引率スタッフ
// =============================================================
async function loadStaff() {
  if (!S.staff.data) renderStaffLoading();
  try {
    var params = S.staff.month ? { month: S.staff.month } : {};
    S.staff.data = await api("staff_list", params);
    S.staff.month = S.staff.data.month;
    S.staff.syncedAt = nowHM();
    renderStaff();
    startStaffPolling();
  } catch (err) { if (S.session) toast(err.message); }
}

function startStaffPolling() {
  stopStaffPolling();
  S.staff.timer = setInterval(async function () {
    if (document.hidden || !S.session || S.session.role !== "staff" || S.staff.syncState) return;
    try {
      var fresh = await api("staff_list", { month: S.staff.month });
      S.staff.data = fresh; S.staff.syncedAt = nowHM(); renderStaff();
    } catch (e) {}
  }, 30000);
}
function stopStaffPolling() { if (S.staff.timer) { clearInterval(S.staff.timer); S.staff.timer = null; } }

function renderStaffLoading() {
  $app.innerHTML = '<div class="wrap"><header class="dark-hdr"><img src="img/kusuka-mark-white.png" alt="クスカ" style="height:16px"></header><main class="main"><div class="small"><span class="spin"></span> 読み込み中…</div></main></div>';
}

function checkBody(d) {
  var g = S.staff.group;
  var list = d.children.filter(function (c) { return !g || c.group === g; });
  var n = list.filter(function (c) { return c.checked; }).length;
  var h = "";
  if (d.groups.length) {
    h += '<div class="chips" role="group" aria-label="グループ" style="margin:0;padding:0">' +
      '<button type="button" class="chip" data-act="staffGroup" data-g="" aria-pressed="' + (!g) + '">全員</button>' +
      d.groups.map(function (x) { return '<button type="button" class="chip" data-act="staffGroup" data-g="' + esc(x) + '" aria-pressed="' + (g === x) + '">' + esc(x) + "</button>"; }).join("") + "</div>";
  }
  h += '<section class="card" aria-label="集合状況"><div class="card-head"><b style="font-family:var(--round);font-size:34px;color:var(--green)">' + n +
    '<span style="font-size:18px;color:var(--sub)"> / ' + list.length + '人</span></b><span class="small" style="font-size:13px">来ています</span></div>' +
    '<div class="progress" role="progressbar" aria-valuenow="' + n + '" aria-valuemin="0" aria-valuemax="' + list.length + '" aria-label="集合した人数"><div style="width:' + (list.length ? Math.round(n / list.length * 100) : 0) + '%"></div></div></section>';
  if (!list.length) h += '<section class="card"><p class="muted">この月に「参加」と回答したお子さまはいません。</p></section>';
  h += '<div style="display:flex;flex-direction:column;gap:8px">' + list.map(function (c) {
    return '<label class="check-kid' + (c.checked ? " on" : "") + '"><input type="checkbox" data-change="staffCheck" data-name="' + esc(c.name) + '"' + (c.checked ? " checked" : "") + ">" +
      '<span class="n"><b>' + esc(c.name) + '</b><span class="small">' + esc(c.type.toUpperCase()) + (c.group ? "・" + esc(c.group) : "") + "</span></span>" +
      (c.checked ? '<b style="font-size:13px;color:var(--green-d)">' + esc(c.at) + "</b>" : '<span class="small" style="font-size:13px">まだ</span>') + "</label>";
  }).join("") + "</div>";
  h += '<section class="card" aria-label="家庭からの連絡"><h2 style="font-size:14px">家庭からの連絡</h2>' + (d.notes.length ? d.notes.map(function (x) {
    return '<div style="font-size:13px"><b>' + esc(x.name) + "の家庭</b><div class=\"muted\">" + esc(x.text) + "</div></div>";
  }).join("") : '<p class="muted">この月の連絡はありません。</p>') + "</section>";
  return h;
}

function renderStaff() {
  var d = S.staff.data;
  if (!d) return renderStaffLoading();
  var monthOpts = d.schedule.map(function (e) {
    return '<option value="' + e.month + '"' + (e.month === d.month ? " selected" : "") + ">" + e.month + "月（" + esc(e.label) + "）</option>";
  }).join("");
  $app.innerHTML = '<div class="wrap"><header class="dark-hdr"><div style="display:flex;flex-direction:column;gap:6px">' +
    '<img src="img/kusuka-mark-white.png" alt="クスカ" style="height:16px;width:auto;align-self:flex-start">' +
    '<b style="font-family:var(--round);font-size:18px">当日チェック</b><span style="font-size:12px;color:var(--on-dark)">' + esc(CLASSES[d.classId].label) + "・" + esc(d.dateLabel) + "</span></div>" +
    '<button class="link-sub" type="button" data-act="logout">ログアウト</button></header><main class="main">' +
    '<div><label class="f" for="stMonth">対象の月</label><select id="stMonth" data-change="staffMonth">' + monthOpts + "</select></div>" +
    checkBody(d) +
    '<div class="small" style="text-align:center">' + (S.staff.syncState === "saving" ? '<span class="spin"></span> 保存中…' : "ほかのスタッフのチェックも30秒ごとに反映・最終 " + esc(S.staff.syncedAt)) +
    '</div><button type="button" class="link" style="align-self:center" data-act="staffReload">今すぐ更新</button></main></div>';
}

// =============================================================
// 起動
// =============================================================
// LINEグループのリンク（?c=クラス&k=合言葉）から開いたとき：合言葉を端末に覚えてURLから消す
function readJoinLink() {
  var q = new URLSearchParams(location.search);
  var c = q.get("c"), k = q.get("k");
  if (!k) return;
  store("kusuka_join", { c: CLASSES[c] ? c : "", k: k });
  q.delete("c"); q.delete("k");
  var rest = q.toString();
  history.replaceState({}, "", location.pathname + (rest ? "?" + rest : "") + (location.hash || ""));
}

async function autoJoin(cls) {
  var L = S.login, join = load("kusuka_join");
  if (L.joining || !join || S.session || !cls) return;
  L.joining = true; L.error = "";
  if (!join.c) render();
  try {
    var r = await api("login_class", { classId: cls, password: join.k });
    store("kusuka_join", { c: cls, k: join.k });
    S.login = { step: "name", classId: cls, names: r.names, classToken: r.classToken, error: "" };
  } catch (err) {
    L.joining = false;
    if (err.code === "password") { store("kusuka_join", undefined); L.joinFailed = true; L.classId = cls; }
    else { L.manual = true; L.error = err.message; }
  }
  if (!S.session) render();
}

async function boot() {
  readJoinLink();
  var saved = load("kusuka_session_v1");
  S.session = saved && saved.token ? saved : null;

  var q = new URLSearchParams(location.search);
  var paid = q.get("paid"), sid = q.get("session_id");
  if (paid !== null) {
    var clean = location.pathname + (location.hash || "");
    history.replaceState({}, "", clean);
  }

  if (!S.session) { render(); return; }
  var role = S.session.role;
  if (role === "admin") { if (currentView() !== "admin") location.hash = "#/admin"; loadAdmin(); return; }
  if (role === "staff") { if (currentView() !== "staff") location.hash = "#/staff"; loadStaff(); return; }

  render();
  try {
    await loadParent();
    if (sid) {
      var r = await api("confirm_payment", { sessionId: sid });
      if (r.status === "paid") {
        S.month = r.month; S.justPaid = true;
        await loadParent();
        toast("お支払いが完了しました。ありがとうございました！", true);
        go("pay");
      } else {
        toast("お支払いの確認ができませんでした。時間をおいて、もう一度開いてください。");
      }
    } else if (paid === "0") {
      toast("お支払いはキャンセルされました。");
      go("pay");
    }
  } catch (err) {
    if (S.session) {
      toast(err.message);
      if (!S.data) $app.innerHTML = '<div class="wrap">' + header() + '<main class="main"><section class="card"><h2>読み込めませんでした</h2><p class="muted">' +
        esc(err.message) + '</p><button class="btn btn-primary" type="button" onclick="location.reload()">もう一度読み込む</button></section></main></div>';
    }
  }
}

boot();
</script>
</body>
</html>
